<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 번호 추첨기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 40px 30px;
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    color: #1e3c72;
    margin-bottom: 8px;
  }
  .subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 30px;
  }
  .balls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    min-height: 62px;
    margin-bottom: 30px;
  }
  .ball {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .placeholder {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ccc;
    font-size: 24px;
  }
  /* 번호 구간별 색상 (한국 로또 규칙) */
  .c1 { background: #fbc400; } /* 1-10 노랑 */
  .c2 { background: #69c8f2; } /* 11-20 파랑 */
  .c3 { background: #ff7272; } /* 21-30 빨강 */
  .c4 { background: #aaa;    } /* 31-40 회색 */
  .c5 { background: #b0d840; } /* 41-45 초록 */
  .plus {
    align-self: center;
    font-size: 24px;
    color: #999;
    font-weight: bold;
  }
  .bonus-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 8px;
  }
  button {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    border: none;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 6px 16px rgba(30,60,114,0.4);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(30,60,114,0.5); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .history {
    margin-top: 30px;
    text-align: left;
  }
  .history h2 {
    font-size: 14px;
    color: #666;
    margin-bottom: 10px;
    border-bottom: 1px solid #eee;
    padding-bottom: 6px;
  }
  .history-item {
    font-size: 15px;
    color: #444;
    padding: 6px 0;
    letter-spacing: 1px;
  }
  .history-item .num { display: inline-block; width: 26px; font-weight: bold; }
</style>
</head>
<body>
  <div class="container">
    <h1>🎰 로또 번호 추첨기</h1>
    <p class="subtitle">1~45 중 6개 번호 + 보너스 번호</p>

    <div class="balls" id="balls">
      <div class="placeholder">?</div>
      <div class="placeholder">?</div>
      <div class="placeholder">?</div>
      <div class="placeholder">?</div>
      <div class="placeholder">?</div>
      <div class="placeholder">?</div>
    </div>

    <button id="drawBtn" onclick="draw()">번호 추첨하기</button>

    <div class="history" id="historyBox" style="display:none;">
      <h2>추첨 기록</h2>
      <div id="history"></div>
    </div>
  </div>

<script>
  function colorClass(n) {
    if (n <= 10) return 'c1';
    if (n <= 20) return 'c2';
    if (n <= 30) return 'c3';
    if (n <= 40) return 'c4';
    return 'c5';
  }

  function pickNumbers() {
    const pool = [];
    for (let i = 1; i <= 45; i++) pool.push(i);
    // Fisher-Yates 셔플
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const main = pool.slice(0, 6).sort((a, b) => a - b);
    const bonus = pool[6];
    return { main, bonus };
  }

  let drawing = false;

  function draw() {
    if (drawing) return;
    drawing = true;
    const btn = document.getElementById('drawBtn');
    btn.disabled = true;

    const { main, bonus } = pickNumbers();
    const ballsBox = document.getElementById('balls');
    ballsBox.innerHTML = '';

    // 공을 하나씩 순차적으로 표시
    let idx = 0;
    const all = [...main, '+', bonus];
    const timer = setInterval(() => {
      if (all[idx] === '+') {
        const plus = document.createElement('div');
        plus.className = 'plus';
        plus.textContent = '+';
        ballsBox.appendChild(plus);
      } else {
        const n = all[idx];
        const ball = document.createElement('div');
        ball.className = 'ball ' + colorClass(n);
        ball.textContent = n;
        ballsBox.appendChild(ball);
      }
      idx++;
      if (idx >= all.length) {
        clearInterval(timer);
        drawing = false;
        btn.disabled = false;
        addHistory(main, bonus);
      }
    }, 350);
  }

  function addHistory(main, bonus) {
    const box = document.getElementById('historyBox');
    box.style.display = 'block';
    const hist = document.getElementById('history');
    const item = document.createElement('div');
    item.className = 'history-item';
    item.textContent = main.map(n => String(n).padStart(2, ' ')).join(', ') + '  +  ' + bonus;
    hist.prepend(item);
    // 최근 5개만 유지
    while (hist.children.length > 5) hist.removeChild(hist.lastChild);
  }
</script>
</body>
</html>
